name: Package platform VSIX artifacts

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-platforms-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc

jobs:
  package:
    name: Package ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
            bundled: true
            platform: darwin
            arch: arm64
            rust_target: aarch64-apple-darwin
            binary: tomlsmith-server/bin/tomlsmith-lsp
            external_server: ""
            packaged_binary: extension/server/darwin-arm64/tomlsmith-lsp
            macos_deployment_target: "11.0"
            musl: false
          - runner: macos-15-intel
            target: darwin-x64
            bundled: true
            platform: darwin
            arch: x64
            rust_target: x86_64-apple-darwin
            binary: tomlsmith-server/bin/tomlsmith-lsp
            external_server: ""
            packaged_binary: extension/server/darwin-x64/tomlsmith-lsp
            macos_deployment_target: "10.15"
            musl: false
          - runner: ubuntu-24.04-arm
            target: linux-arm64
            bundled: true
            platform: linux
            arch: arm64
            rust_target: aarch64-unknown-linux-musl
            binary: tomlsmith-server/bin/tomlsmith-lsp
            external_server: ""
            packaged_binary: extension/server/linux-arm64/tomlsmith-lsp
            macos_deployment_target: ""
            musl: true
          - runner: ubuntu-24.04
            target: linux-x64
            bundled: true
            platform: linux
            arch: x64
            rust_target: x86_64-unknown-linux-musl
            binary: tomlsmith-server/bin/tomlsmith-lsp
            external_server: ""
            packaged_binary: extension/server/linux-x64/tomlsmith-lsp
            macos_deployment_target: ""
            musl: true
          - runner: windows-2025
            target: win32-x64
            bundled: true
            platform: win32
            arch: x64
            rust_target: x86_64-pc-windows-msvc
            binary: tomlsmith-server/bin/tomlsmith-lsp.exe
            external_server: ""
            packaged_binary: extension/server/win32-x64/tomlsmith-lsp.exe
            macos_deployment_target: ""
            musl: false
          - runner: ubuntu-24.04
            target: universal
            bundled: false
            platform: ""
            arch: ""
            rust_target: ""
            binary: tomlsmith-server/bin/tomlsmith-lsp
            external_server: tomlsmith-server/bin/tomlsmith-lsp
            packaged_binary: ""
            macos_deployment_target: ""
            musl: false
    steps:
      - name: Check out extension
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Read published server package
        id: server
        shell: bash
        run: |
          node -e "const pkg = require('./server-package.json'); if (pkg.crate !== 'tomlsmith-lsp' || !/^\\d+\\.\\d+\\.\\d+$/.test(pkg.version)) throw new Error('server-package.json must name an exact tomlsmith-lsp version')"
          echo "crate=$(node -p 'require("./server-package.json").crate')" >> "${GITHUB_OUTPUT}"
          echo "version=$(node -p 'require("./server-package.json").version')" >> "${GITHUB_OUTPUT}"

      - name: Check release tag matches extension version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          extension_version=$(node -p "require('./package.json').version")
          test "v${extension_version}" = "${GITHUB_REF_NAME}"

      - name: Install pinned Rust toolchain and target
        if: ${{ matrix.bundled == true }}
        shell: bash
        run: |
          rustup toolchain install 1.85.0 --profile minimal --target "${{ matrix.rust_target }}"

      - name: Install pinned Rust toolchain for the fallback test server
        if: ${{ matrix.bundled == false }}
        shell: bash
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Install musl linker
        if: matrix.musl
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Install published language server for the target
        if: ${{ matrix.bundled == true }}
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
        run: |
          cargo +1.85.0 install "${{ steps.server.outputs.crate }}" \
            --version "=${{ steps.server.outputs.version }}" \
            --locked \
            --target "${{ matrix.rust_target }}" \
            --root "${{ github.workspace }}/tomlsmith-server"

      - name: Install published language server for the fallback test
        if: ${{ matrix.bundled == false }}
        shell: bash
        run: |
          cargo +1.85.0 install "${{ steps.server.outputs.crate }}" \
            --version "=${{ steps.server.outputs.version }}" \
            --locked \
            --root "${{ github.workspace }}/tomlsmith-server"

      - name: Install extension dependencies
        run: pnpm install --frozen-lockfile

      - name: Build extension
        run: pnpm build

      - name: Stage language server
        if: ${{ matrix.bundled == true }}
        run: pnpm bundle-server --binary ${{ matrix.binary }} --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}

      - name: Test staged language server
        if: ${{ matrix.bundled == true }}
        run: pnpm exec vitest run test/server-package.test.ts
        env:
          TOMLSMITH_LSP_SMOKE_BINARY: ${{ matrix.binary }}

      - name: Package platform VSIX
        if: ${{ matrix.bundled == true }}
        run: pnpm dlx @vscode/vsce@3.9.2 package --no-dependencies --target ${{ matrix.target }} -o tomlsmith-${{ matrix.target }}.vsix

      - name: Package universal fallback VSIX
        if: ${{ matrix.bundled == false }}
        run: pnpm dlx @vscode/vsce@3.9.2 package --no-dependencies -o tomlsmith-${{ matrix.target }}.vsix

      - name: Extract packaged VSIX on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir extracted-vsix
          unzip -q "tomlsmith-${{ matrix.target }}.vsix" -d extracted-vsix

      - name: Extract packaged VSIX on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "tomlsmith-${{ matrix.target }}.vsix" "tomlsmith-${{ matrix.target }}.zip"
          Expand-Archive "tomlsmith-${{ matrix.target }}.zip" -DestinationPath extracted-vsix

      - name: Test server extracted from VSIX
        if: ${{ matrix.bundled == true }}
        run: pnpm exec vitest run test/server-package.test.ts
        env:
          TOMLSMITH_LSP_SMOKE_BINARY: extracted-vsix/${{ matrix.packaged_binary }}

      - name: Verify universal fallback excludes a server binary
        if: ${{ matrix.bundled == false }}
        shell: bash
        run: test ! -e extracted-vsix/extension/server

      - name: Install VSIX in VS Code and exercise language features on Linux
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm exec vitest run test/vsix-install.test.ts
        env:
          TOMLSMITH_VSIX_E2E: tomlsmith-${{ matrix.target }}.vsix
          TOMLSMITH_VSIX_EXTERNAL_SERVER: ${{ matrix.external_server }}
          TOMLSMITH_VSCODE_VERSION: "1.95.0"

      - name: Install VSIX in VS Code and exercise language features
        if: runner.os != 'Linux'
        run: pnpm exec vitest run test/vsix-install.test.ts
        env:
          TOMLSMITH_VSIX_E2E: tomlsmith-${{ matrix.target }}.vsix
          TOMLSMITH_VSIX_EXTERNAL_SERVER: ${{ matrix.external_server }}
          TOMLSMITH_VSCODE_VERSION: "1.95.0"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: vsix-${{ matrix.target }}
          path: tomlsmith-${{ matrix.target }}.vsix
          retention-days: 14
          if-no-files-found: error

  release:
    name: Publish tested VSIX release
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download every tested platform package
        uses: actions/download-artifact@v8
        with:
          pattern: vsix-*
          path: release
          merge-multiple: true

      - name: Generate package checksums
        working-directory: release
        run: sha256sum ./*.vsix > SHA256SUMS

      - name: Create immutable extension release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --title "TomlSmith for VS Code $GITHUB_REF_NAME" --generate-notes
